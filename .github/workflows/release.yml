name: Release

# Builds the fat jar and publishes it to a GitHub Release when a version tag is pushed.
# Flow: bump <version> in pom.xml -> git tag vX.Y.Z -> git push origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Maven
        # The self-hosted runners have no Maven; setup-java installs only the JDK.
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.11

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/keycloak-kafka-*-jar-with-dependencies.jar
